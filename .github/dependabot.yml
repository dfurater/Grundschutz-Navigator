version: 2

updates:
  # Bundle routine npm updates, but leave major upgrades as separate PRs.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    reviewers:
      - "dfurater"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: "increase-if-necessary"
    groups:
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Workflow-Referenzen sind auf Commit-SHAs gepinnt. Dependabot erzeugt für
  # SHA-gepinnte Actions keine Security-Alerts mehr, deshalb ist das
  # Update-Intervall der einzige verbleibende Kanal für sicherheitsrelevante
  # Action-Versionen und läuft täglich statt wöchentlich (GSPP-333).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    reviewers:
      - "dfurater"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
