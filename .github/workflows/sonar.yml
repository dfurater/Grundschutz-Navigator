name: SonarQube

# CI-basierte Analyse (GSPP-404). Ersetzt die Automatic Analysis, die nur den
# GitHub-Default-Branch messen konnte — seit dem Release-Branch-Modell also
# ausschliesslich `develop`, waehrend `main` als Freigabelinie unanalysiert blieb.
#
# Diese Datei traegt seit GSPP-416 allein den Push-Pfad und damit die Messung
# der beiden langlebigen Branches. Die Pull-Request-Analyse liegt im Job
# `sonarqube` in `validate.yml`: Sie braucht den Coverage-Report aus `validate`,
# und nur ein Job desselben Workflows kann ihn uebernehmen. Ein Pull Request
# erzeugt damit genau einen vollstaendigen Suite-Lauf statt zweier.
#
# Bewusst ein eigener Workflow: `validate.yml` startet ueber `pull_request` und
# `workflow_dispatch`. Ein dort ergaenzter Push-Ausloeser wuerde saemtliche Jobs
# jener Datei — Schema-Verifikation, go-oscal-Lauf, Browser-Tests, Build — bei
# jedem Push auf `main` und `develop` mitlaufen lassen.

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Vollstaendige Historie: Der Scanner liest die Git-Blame-Daten des
      # Arbeitsbaums, um Befunde einem Autor und einem Datum zuzuordnen und
      # daraus die New-Code-Periode des langlebigen Branches zu bestimmen. Ein
      # flacher Klon liefert sie nicht.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Bewusst vor jedem teuren Schritt: Ohne diesen Guard liefe erst der
      # gesamte Testlauf, bevor der Scanner mit einem Authentifizierungsfehler
      # abbricht. Die Fallunterscheidung steht seit GSPP-416 in
      # scripts/sonar-token-guard.mjs, weil der Guard hier und im Job
      # `sonarqube` in `validate.yml` gebraucht wird; die Begruendung beider
      # Faelle traegt das Skript.
      #
      # `IS_FORK` bleibt hier ungesetzt: Ein Push auf `main` oder `develop`
      # dieses Repositoriums kommt aus keinem Fork. Der Guard ist fail-closed
      # und wertet jeden anderen Wert als `true` als eigenes Repository — ein
      # fehlendes Token laesst den Lauf also scheitern. Die Fork-Ausnahme gilt
      # allein dem Pull-Request-Pfad in `validate.yml`.
      - name: Analyse-Token pruefen
        id: token
        env:
          SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_CI != '' }}
        run: node scripts/sonar-token-guard.mjs

      - name: Setup Node.js and install dependencies
        if: steps.token.outputs.available == 'true'
        uses: $/.github/actions/setup-node-env

      # Der Testlauf prueft ueber `globalSetup` die Frische der Katalogdaten und
      # schlaegt ohne sie fehl. Gepinnt auf denselben Snapshot wie in
      # validate.yml und deploy.yml: Seit GSPP-419 lesen alle drei ihn aus
      # derselben Action statt aus drei wortgleichen Kopien.
      - name: Read the pinned snapshot and fetch the BSI catalog
        if: steps.token.outputs.available == 'true'
        uses: $/.github/actions/fetch-pinned-catalog
        with:
          github-token: ${{ github.token }}

      # Erzeugt coverage/lcov.info fuer die Abdeckungsmessung in SonarQube und
      # erzwingt dabei die in vite.config.ts gepinnten Schwellen.
      - name: Run tests with coverage
        if: steps.token.outputs.available == 'true'
        run: npm run test:coverage

      - name: SonarQube Scan
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_CI }}
