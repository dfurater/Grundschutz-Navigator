name: SonarQube

# CI-basierte Analyse (GSPP-404). Ersetzt die Automatic Analysis, die nur den
# GitHub-Default-Branch messen konnte — seit dem Release-Branch-Modell also
# ausschliesslich `develop`, waehrend `main` als Freigabelinie unanalysiert blieb.
#
# Bewusst ein eigener Workflow: ci.yml startet nur ueber `pull_request` und
# `workflow_dispatch`. Ein dort ergaenzter Push-Ausloeser wuerde saemtliche Jobs
# jener Datei bei jedem Push mitlaufen lassen.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      # Vollstaendige Historie: Die PR-Analyse braucht den Quellbranch ausgecheckt
      # und den Zielbranch im lokalen Repository, sonst kann SonarQube den neuen
      # Code nicht bestimmen.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fail closed mit sprechender Meldung, und bewusst vor jedem teuren Schritt:
      # Dependabot-Laeufe sehen die Actions-Secrets nicht, sondern nur
      # Dependabot-Secrets. Ohne diesen Guard liefe erst der gesamte Testlauf,
      # bevor der Scanner mit einem Authentifizierungsfehler abbricht.
      - name: Analyse-Token pruefen
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_CI }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::Secret SONAR_CI ist in diesem Lauf nicht verfuegbar. Bei Dependabot-Laeufen muss das Token zusaetzlich unter Settings > Secrets and variables > Dependabot hinterlegt sein."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read pinned snapshot SHA from manifest
        id: manifest
        run: |
          sha=$(jq -r '.snapshotCommitSha' upstream-manifest.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Der Testlauf prueft ueber `globalSetup` die Frische der Katalogdaten und
      # schlaegt ohne sie fehl. Gepinnt auf denselben Snapshot wie in ci.yml.
      - name: Fetch BSI catalog from pinned snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BSI_SNAPSHOT_SHA: ${{ steps.manifest.outputs.sha }}
        run: npm run fetch-catalog

      # Erzeugt coverage/lcov.info fuer die Abdeckungsmessung in SonarQube und
      # erzwingt dabei die in vite.config.ts gepinnten Schwellen.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_CI }}
