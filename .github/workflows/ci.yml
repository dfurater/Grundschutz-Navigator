name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate documentation impact declaration
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-documentation-contract.mjs

  catalog-sync-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full PR history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate catalog sync PR contract
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/catalog-sync-guard.mjs

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Trägt die Integritätszusage der gebündelten Stufe-3-Schemas. Läuft
      # bewusst vor jedem Netzschritt und ohne selbst einen auszuführen; der
      # Netzpfad bleibt allein `npm run sync-oscal-schemas` und ist kein
      # CI-Schritt.
      - name: Verify pinned OSCAL schemas
        run: npm run verify-oscal-schemas

      - name: Read pinned snapshot SHA from manifest
        id: manifest
        run: |
          sha=$(jq -r '.snapshotCommitSha' upstream-manifest.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch BSI catalog from pinned snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BSI_SNAPSHOT_SHA: ${{ steps.manifest.outputs.sha }}
        run: npm run fetch-catalog

      - name: Resolve all BSI profiles deterministically (mandatory build-time corpus)
        run: npm run test:profile-resolution

      - name: Verify upstream OSCAL schemas with go-oscal
        env:
          GO_OSCAL_SBOM_OUTPUT: ${{ runner.temp }}/sbom_go-oscal_v0.7.1_Linux_amd64.sbom
        run: npm run verify-upstream-oscal

      - name: Archive go-oscal SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-oscal-v0.7.1-sbom-linux-amd64
          path: ${{ runner.temp }}/sbom_go-oscal_v0.7.1_Linux_amd64.sbom
          if-no-files-found: error
          retention-days: 90

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Install pinned Chromium for browser tests
        run: ./node_modules/.bin/playwright install chromium

      - name: Run Chromium browser tests
        run: npm run test:browser

      - name: Verify browser egress oracle
        run: npm run test:browser:egress-negative

      - name: Build application
        run: npm run build
