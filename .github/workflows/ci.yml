name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-sync-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full PR history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate catalog sync PR contract
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/catalog-sync-guard.mjs

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read pinned snapshot SHA from manifest
        id: manifest
        run: |
          sha=$(jq -r '.snapshotCommitSha' upstream-manifest.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch BSI catalog from pinned snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BSI_SNAPSHOT_SHA: ${{ steps.manifest.outputs.sha }}
        run: npm run fetch-catalog

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
