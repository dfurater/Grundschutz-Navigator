name: Prepare release PR

# Erzeugt aus einem freigegebenen `develop`-Stand den Release-Pull-Request nach
# `main`. Der Lauf mergt nicht und deployt nicht; der Merge bleibt die
# dokumentierte Freigabe-Entscheidung des Projektowners.
#
# Ausschließlich manuell: Jeder Merge auf `main` deployt automatisch auf Pages,
# und eine Freigabe ist eine Entscheidung, kein Ereignis.

on:
  workflow_dispatch:
    inputs:
      develop_sha:
        description: >-
          Freigegebener develop-Commit, als 40-stelliger Kleinbuchstaben-SHA.
          Ein Branchname wird abgelehnt: Er übernähme den jeweils aktuellen
          Head statt des Stands, über den die Freigabe entschieden wurde.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and install dependencies
        uses: $/.github/actions/setup-node-env

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CATALOG_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity for the app
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          BOT_ID="$(gh api "users/${APP_SLUG}[bot]" --jq '.id')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Prepare and verify the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_DEVELOP_SHA: ${{ inputs.develop_sha }}
        run: node scripts/release-prepare.mjs
