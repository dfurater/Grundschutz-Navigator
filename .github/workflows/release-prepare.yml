name: Prepare release PR

# Erzeugt aus einem freigegebenen `develop`-Stand den Release-Pull-Request nach
# `main`. Der Lauf mergt nicht und deployt nicht; der Merge bleibt die
# dokumentierte Freigabe-Entscheidung des Projektowners.
#
# Ausschließlich manuell: Jeder Merge auf `main` deployt automatisch auf Pages,
# und eine Freigabe ist eine Entscheidung, kein Ereignis.

on:
  workflow_dispatch:
    inputs:
      develop_sha:
        description: >-
          Freigegebener develop-Commit (40-stelliger SHA). Leer lässt den
          aktuellen origin/develop-Head verwenden.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CATALOG_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity for the app
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          BOT_ID="$(gh api "users/${APP_SLUG}[bot]" --jq '.id')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Prepare and verify the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_DEVELOP_SHA: ${{ inputs.develop_sha }}
        run: node scripts/release-prepare.mjs
