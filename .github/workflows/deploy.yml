name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: >-
          Leave empty for a manual deploy. `catalog-sync-fallback` marks the
          automated fallback dispatch and enables the idempotency guard below.
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The catalog-sync fallback (verify-catalog-merge.yml) dispatches this workflow
  # when it saw no push deploy for the merge commit. Between its last check and
  # the dispatch, GitHub can still register the push deploy, which would deploy
  # the same commit twice. The `pages` concurrency group queues this run behind
  # that push deploy, so by the time this guard runs the push deploy has reached
  # a terminal state and the check is meaningful. The guard is deliberately
  # limited to the fallback: a manual dispatch leaves `dispatch_source` empty and
  # always deploys, so a re-deploy on an unchanged main stays possible.
  idempotency_guard:
    if: github.event.inputs.dispatch_source == 'catalog-sync-fallback'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip_deploy: ${{ steps.check.outputs.skip_deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether this commit already deployed
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-deploy-idempotency.mjs

  build-and-deploy:
    needs: [idempotency_guard]
    # `!cancelled()` keeps this job reachable when the guard is skipped (push and
    # manual dispatch) or fails. The guard may only prevent a redundant deploy,
    # never a required one.
    if: ${{ !cancelled() && needs.idempotency_guard.outputs.skip_deploy != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read pinned snapshot SHA from manifest
        id: manifest
        run: |
          sha=$(jq -r '.snapshotCommitSha' upstream-manifest.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch BSI catalog and official vocabularies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BSI_SNAPSHOT_SHA: ${{ steps.manifest.outputs.sha }}
        run: npm run fetch-catalog

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Build application
        env:
          VITE_IMPRESSUM_NAME: ${{ secrets.VITE_IMPRESSUM_NAME }}
          VITE_IMPRESSUM_STRASSE: ${{ secrets.VITE_IMPRESSUM_STRASSE }}
          VITE_IMPRESSUM_PLZ_ORT: ${{ secrets.VITE_IMPRESSUM_PLZ_ORT }}
          VITE_IMPRESSUM_EMAIL: ${{ secrets.VITE_IMPRESSUM_EMAIL }}
          VITE_IMPRESSUM_TELEFON: ${{ secrets.VITE_IMPRESSUM_TELEFON }}
        run: npm run build

      - name: Generate SLSA Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/**'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
