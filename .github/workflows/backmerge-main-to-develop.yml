name: Backmerge main to develop

# Inhalts-Übernahme von der Freigabe- auf die Integrationslinie. Der Lauf mergt
# nicht und löscht keine Branches; er stellt ausschließlich einen Pull Request.
#
# Beide Auslöser sind nötig: `push: main` reagiert auf den Catalog-Sync und auf
# Hotfixes, `push: develop` auf den menschlichen Merge eines Übernahme-PRs — der
# Folgelauf muss die dann erreichte Ancestry sofort nachrechnen können und darf
# nicht auf ein Produktionsereignis warten.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Überlappende Läufe aus beiden Auslösern werden serialisiert statt verworfen:
# Jeder Lauf trifft eine Aussage über einen konkreten Stand beider Linien, und
# ein abgebrochener Lauf ließe die Ancestry-Prüfung ungeprüft zurück.
concurrency:
  group: backmerge-main-to-develop
  cancel-in-progress: false

jobs:
  backmerge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and install dependencies
        uses: $/.github/actions/setup-node-env

      # Dieselbe repository-beschränkte GitHub App wie die Catalog-Sync-Lane.
      # Ihr Installation-Token erzeugt Workflow-Läufe auf dem gestellten Pull
      # Request; `GITHUB_TOKEN` täte das nicht, der Übernahme-PR bliebe dann
      # ohne die Checks, die seine Merge-Fähigkeit begründen.
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CATALOG_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity for the app
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          BOT_ID="$(gh api "users/${APP_SLUG}[bot]" --jq '.id')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Classify and stage the content import
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/backmerge-main-to-develop.mjs
