name: Check Catalog Updates

on:
  schedule:
    - cron: '0 6 * * *'  # Taeglich um 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    env:
      CATALOG_SYNC_RULESET_UPDATED_AT: ${{ vars.CATALOG_SYNC_RULESET_UPDATED_AT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository merge policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/catalog-sync-policy.mjs

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CATALOG_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Verify GitHub App repository access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          repository="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name')"
          if [ "$repository" != "$GITHUB_REPOSITORY" ]; then
            echo "GitHub App token does not resolve to the expected repository." >&2
            exit 1
          fi
          echo "GitHub App token has repository access."

      - name: Fetch BSI catalog and official vocabularies
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run fetch-catalog

      - name: Compare with tracked upstream manifest
        id: compare
        run: |
          set -euo pipefail
          RESULT="$(node scripts/sync-upstream-manifest.mjs)"
          printf '%s\n' "$RESULT"

          SYNC_JSON="$(printf '%s\n' "$RESULT" | sed -n 's/^SYNC_RESULT_JSON=//p' | tail -n 1)"
          if [ -z "$SYNC_JSON" ]; then
            echo "SYNC_RESULT_JSON missing from sync-upstream-manifest output" >&2
            exit 1
          fi

          DELIMITER="gha_delimiter_$(date +%s)_$$"
          {
            printf 'changed=%s\n' "$(printf '%s' "$SYNC_JSON" | jq -r '.changed')"
            printf 'local_signature=%s\n' "$(printf '%s' "$SYNC_JSON" | jq -r '.local_signature')"
            printf 'remote_signature=%s\n' "$(printf '%s' "$SYNC_JSON" | jq -r '.remote_signature')"
            printf 'snapshot_commit_sha=%s\n' "$(printf '%s' "$SYNC_JSON" | jq -r '.snapshot_commit_sha')"
            printf 'change_summary<<%s\n' "$DELIMITER"
            printf '%s\n' "$(printf '%s' "$SYNC_JSON" | jq -r '.change_summary')"
            printf '%s\n' "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve expected manifest
        if: steps.compare.outputs.changed == 'true'
        run: cp upstream-manifest.json "$RUNNER_TEMP/upstream-manifest.expected.json"

      - name: Resolve deterministic sync branch
        id: sync
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SNAPSHOT_SHA: ${{ steps.compare.outputs.snapshot_commit_sha }}
        run: |
          set -euo pipefail
          BRANCH="chore/catalog-sync-${SNAPSHOT_SHA:0:12}"
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Rebuild and push sync branch from main
        if: steps.compare.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA: ${{ steps.compare.outputs.snapshot_commit_sha }}
        run: |
          set -euo pipefail
          node scripts/catalog-sync-policy.mjs

          gh auth setup-git
          BOT_ID="$(gh api "users/${APP_SLUG}[bot]" --jq '.id')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch --no-tags origin main
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk 'NR == 1 { print $1 }')"
          git switch --force-create "$BRANCH" origin/main
          cp "$RUNNER_TEMP/upstream-manifest.expected.json" upstream-manifest.json
          git add -- upstream-manifest.json

          STAGED_PATHS="$(git diff --cached --name-only)"
          if [ "$STAGED_PATHS" != "upstream-manifest.json" ]; then
            echo "Expected exactly upstream-manifest.json in the sync commit." >&2
            exit 1
          fi

          git commit -m "chore(ci): update BSI upstream manifest (${SNAPSHOT_SHA:0:12})"
          if [ -n "$REMOTE_SHA" ]; then
            git push \
              --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" \
              origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Create or update sync PR
        id: pr
        if: steps.compare.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
          CHANGE_SUMMARY: ${{ steps.compare.outputs.change_summary }}
          EXISTING_PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_SIGNATURE: ${{ steps.compare.outputs.remote_signature }}
          SNAPSHOT_SHA: ${{ steps.compare.outputs.snapshot_commit_sha }}
        run: |
          set -euo pipefail
          node scripts/catalog-sync-policy.mjs

          TITLE="chore(ci): BSI-Katalog-Sync ${SNAPSHOT_SHA:0:12}"
          {
            echo "## BSI-Katalog-Aenderungen"
            echo ""
            printf '%s\n' "$CHANGE_SUMMARY"
            echo ""
            printf '**BSI-Snapshot:** [`%s`](https://github.com/BSI-Bund/Stand-der-Technik-Bibliothek/commit/%s)\n' \
              "$SNAPSHOT_SHA" "$SNAPSHOT_SHA"
            printf '**Manifest-Signatur:** `%s`\n' "$REMOTE_SIGNATURE"
            echo ""
            echo "Auto-Merge wird erst nach Validate, Catalog-Sync-Guard und CodeQL aktiviert."
          } > "$RUNNER_TEMP/catalog-sync-pr-body.md"

          if [ -n "$EXISTING_PR_NUMBER" ]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$EXISTING_PR_NUMBER" \
              --raw-field "title=$TITLE" \
              --raw-field "body=$(< "$RUNNER_TEMP/catalog-sync-pr-body.md")" \
              >/dev/null
            PR_NUMBER="$EXISTING_PR_NUMBER"
            echo "Updated catalog sync PR #$PR_NUMBER."
          else
            PR_URL="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file "$RUNNER_TEMP/catalog-sync-pr-body.md" \
              --base main \
              --head "$BRANCH")"
            PR_NUMBER="$(gh pr view "$PR_URL" --json number --jq '.number')"
            echo "Created catalog sync PR: $PR_URL"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable policy-gated auto-merge
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          node scripts/catalog-sync-policy.mjs

          if [ -z "$PR_NUMBER" ]; then
            echo "No catalog sync PR number available." >&2
            exit 1
          fi

          gh pr merge \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch \
            "$PR_NUMBER"

          PR_STATE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          AUTO_MERGE_METHOD="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest \
            --jq '.autoMergeRequest.mergeMethod // empty')"
          if [ "$PR_STATE" != "OPEN" ] || [ "$AUTO_MERGE_METHOD" != "SQUASH" ]; then
            echo "Catalog sync PR does not have the expected active squash autoMergeRequest." >&2
            exit 1
          fi
          echo "Policy-gated squash auto-merge is active for PR #$PR_NUMBER."
