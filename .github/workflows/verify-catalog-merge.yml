name: Verify Catalog Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  verify-catalog-merge:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/catalog-sync-') &&
      startsWith(github.event.pull_request.title, 'chore(ci): BSI-Katalog-Sync ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Verify merged sync PR and manifest
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_BRANCH" =~ ^chore/catalog-sync-([0-9a-f]{12})$ ]]; then
            echo "Merged PR branch does not match the catalog sync contract." >&2
            exit 1
          fi
          if [ "$PR_TITLE" != "chore(ci): BSI-Katalog-Sync ${BASH_REMATCH[1]}" ]; then
            echo "Merged PR title does not match its catalog sync branch." >&2
            exit 1
          fi

          CHANGED_FILES="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | "\(.status)\t\(.filename)"')"
          if [ "$CHANGED_FILES" != $'modified\tupstream-manifest.json' ]; then
            echo "Merged catalog sync PR did not modify exactly upstream-manifest.json." >&2
            exit 1
          fi

          COMPARE_STATUS="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/main...$MERGE_COMMIT_SHA" \
            --jq '.status')"
          case "$COMPARE_STATUS" in
            identical|behind)
              ;;
            *)
              echo "Merge commit is not on main (status=$COMPARE_STATUS)." >&2
              exit 1
              ;;
          esac

          node scripts/catalog-sync-guard.mjs --validate-manifest upstream-manifest.json
          SNAPSHOT_SHA="$(jq -r '.snapshotCommitSha' upstream-manifest.json)"
          SIGNATURE="$(jq -r '.signatureSha256' upstream-manifest.json)"
          echo "merge_commit_sha=$MERGE_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "snapshot_sha=$SNAPSHOT_SHA" >> "$GITHUB_OUTPUT"
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Confirm push deploy or require safe fallback
        id: deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ steps.verify.outputs.merge_commit_sha }}
          SNAPSHOT_SHA: ${{ steps.verify.outputs.snapshot_sha }}
          SIGNATURE: ${{ steps.verify.outputs.signature }}
        run: node scripts/verify-catalog-deploy.mjs

      # `dispatch_source` lets deploy.yml recognise this run as the fallback and
      # skip itself if the push deploy registered after the last check above.
      - name: Dispatch verified fallback deploy
        if: steps.deploy.outputs.fallback_dispatch_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field dispatch_source=catalog-sync-fallback
