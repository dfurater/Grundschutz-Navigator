# SonarQube Cloud, Automatic Analysis (GSPP-374).
#
# Einziger Zweck dieser Datei: die Copy-Paste-Erkennung von der deklarativen
# Regeltabelle in scripts/review-policy.mjs fernhalten.
#
# Warum: Die Datei führt 26 Reviewregeln als gleichförmige Einträge aus
# Schlüssel, Scope-Liste und Regeltext. CPD misst wiederholte Token-Folgen;
# eine Datentabelle mit 26 strukturgleichen Einträgen erzeugt dabei
# zwangsläufig Treffer, ohne dass irgendein Verhalten kopiert wäre. Der Befund
# ist hier kein Wartbarkeitssignal, sondern eine Eigenschaft des Formats.
#
# Bewusst eng gefasst: genau dieser eine Pfad, und ausschließlich die
# Duplikatsmessung. Alle übrigen Regeln, das Quality Gate und jede andere Datei
# bleiben unverändert unter voller Prüfung. Keine Schwelle wird gesenkt.
sonar.cpd.exclusions=scripts/review-policy.mjs
