    <!--
      Die Tabellenansicht nutzt Inter 600 erst nach ihrem ersten Render; ohne
      Preload löst das spätere Eintreffen der Schrift ein zweites Layout aller

    -->

    <link rel="preload" href="/fonts/inter-latin-500.woff2" as="font" type="font/woff2" crossorigin />
