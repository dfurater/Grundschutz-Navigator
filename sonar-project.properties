# SonarQube Cloud, CI-basierte Analyse (GSPP-404).
#
# Diese Datei ersetzt `.sonarcloud.properties`. Jene wurde ausschließlich von
# der Automatic Analysis gelesen, die mit GSPP-404 abgeschaltet wurde; laut
# Herstellerdokumentation ist sie "different from the sonar-project.properties
# file used for CI-based analysis". Ohne diese Übertragung wäre die
# Duplikatsausnahme unten wirkungslos geworden, ohne in einem Diff aufzutauchen.

sonar.projectKey=gspp
sonar.organization=gspp

# --- Duplikatsausnahme (übernommen aus .sonarcloud.properties, GSPP-374) ------
#
# Einziger Zweck: die Copy-Paste-Erkennung von der Regeltabelle der
# Review-Policy fernhalten.
#
# Warum: scripts/review-policy.rules.mjs führt die Reviewregeln als
# gleichförmige Einträge aus Schlüssel, Scope-Liste und Regeltext. CPD misst
# wiederholte Token-Folgen und normalisiert dabei Literale; eine Datentabelle
# aus strukturgleichen Einträgen erzeugt so zwangsläufig Treffer, ohne dass
# irgendein Verhalten kopiert wäre. Der Befund ist hier kein Wartbarkeitssignal,
# sondern eine Eigenschaft des Formats.
#
# Warum genau dieser Pfad: sonar.cpd.exclusions greift ausschließlich dateiweit.
# Solange Tabelle und Logik in einer Datei lagen, hätte die Ausnahme auch
# Generator, Drift-Guard und CLI von der Duplikatsprüfung befreit. Die Tabelle
# steht deshalb getrennt; scripts/review-policy.mjs bleibt vollständig geprüft.
#
# Bewusst eng gefasst: genau dieser eine Pfad, und ausschließlich die
# Duplikatsmessung. Alle übrigen Regeln, das Quality Gate und jede andere Datei
# bleiben unverändert unter voller Prüfung. Keine Schwelle wird gesenkt.
#
# Diese Datei liegt im PR-Head und wirkt von dort. Sie zählt deshalb zu den
# Review-Policy-Pfaden: ein PR, der sie anfasst, braucht ein Agenten-
# Cross-Review (AGENTS.md, Non-negotiables).
sonar.cpd.exclusions=scripts/review-policy.rules.mjs

# --- Testabdeckung ------------------------------------------------------------
#
# Der Workflow erzeugt den Report ueber `npm run test:coverage`; der lcov-Reporter
# ist dafuer in vite.config.ts ergaenzt. `sonar.javascript.lcov.reportPaths` deckt
# laut Dokumentation JavaScript und TypeScript gemeinsam ab — die frueher
# getrennte Eigenschaft sonar.typescript.lcov.reportPaths ist abgekuendigt.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
